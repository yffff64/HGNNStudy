default:
  All_num_layers: 2
  embedding_hidden: 64
  MLP_hidden: 128
  epochs: 200
  dropout: 0.6
  lr: 1.0e-2
  wd: 0.0005

  first_aggregate: "mean" # first_aggregate: ['mean', 'sum']
  input_drop: 0.2
  attn_drop: 0.2
  activation: "relu" # activation: ['relu', 'prelu']
  use_norm: true
  uni_heads: 1
  restart_alpha: 0.5
  UniGNN_degV: 0
  UniGNN_degE: 0

